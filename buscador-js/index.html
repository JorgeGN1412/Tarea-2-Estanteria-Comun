<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Buscador de libros de Estantería Común" />
    <title>Estantería Común | Buscador</title>
    <!-- El CSS generado desde Sass incluye Bootstrap y nuestros estilos. -->
    <link rel="icon" type="image/svg+xml" href="./img/sin-portada.svg" />
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">Estantería Común</a>
      </div>
    </nav>

    <main class="container py-4">
      <section class="mb-4">
        <h1 class="display-6">Buscador de libros</h1>
        <p class="lead">Encuentra libros para las próximas lecturas del club.</p>
      </section>

      <!-- main.js escucha el envío de #form-busqueda y lee #texto-busqueda. -->
      <section aria-labelledby="busqueda-titulo" class="card shadow-sm mb-4">
        <div class="card-body">
          <h2 id="busqueda-titulo" class="h4">Buscar en Open Library</h2>
          <form id="form-busqueda" class="row g-3">
            <div class="col-md-9">
              <label class="form-label" for="texto-busqueda">Título o autor</label>
              <input id="texto-busqueda" name="q" class="form-control" type="search" required minlength="2" />
            </div>
            <div class="col-md-3 d-flex align-items-end">
              <button class="btn btn-primary w-100" type="submit">Buscar</button>
            </div>
          </form>
        </div>
      </section>

      <!-- main.js cambia el aviso; render.js agrega las tarjetas a #resultados. -->
      <div id="estado-busqueda" class="alert d-none" role="status" aria-live="polite"></div>
      <section aria-labelledby="resultados-titulo">
        <h2 id="resultados-titulo" class="h4">Resultados</h2>
        <div id="resultados" class="row g-4"></div>
      </section>

      <!-- El tbody empieza vacío; render.js crea sus filas al agregar libros. -->
      <section aria-labelledby="lecturas-titulo" class="mt-5">
        <h2 id="lecturas-titulo" class="h4">Lista de lecturas</h2>
        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr><th>Libro</th><th>Estado</th><th>Acciones</th></tr>
            </thead>
            <tbody id="lista-lecturas"></tbody>
          </table>
        </div>
      </section>

      <!-- novalidate deja que formulario.js muestre mensajes propios por campo. -->
      <section aria-labelledby="propuesta-titulo" class="card shadow-sm mt-5">
        <div class="card-body">
          <h2 id="propuesta-titulo" class="h4">Proponer una lectura</h2>
          <form id="form-propuesta" class="row g-3" novalidate>
            <div class="col-md-6">
              <label for="titulo" class="form-label">Título</label>
              <input id="titulo" name="titulo" class="form-control" required minlength="2">
              <div class="invalid-feedback" data-error="titulo"></div>
            </div>
            <div class="col-md-6">
              <label class="form-label">Autores (1 a 5)</label>
              <div id="autores-campos"></div>
              <button id="agregar-autor" type="button" class="btn btn-sm btn-outline-primary mt-2">Agregar autor</button>
            </div>
            <div class="col-md-4">
              <label for="anio" class="form-label">Año de publicación</label>
              <input id="anio" name="anio" type="number" class="form-control" required min="1450">
              <div class="invalid-feedback" data-error="anio"></div>
            </div>
            <div class="col-md-4">
              <label for="paginas" class="form-label">Páginas</label>
              <input id="paginas" name="paginas" type="number" class="form-control" required min="1">
              <div class="invalid-feedback" data-error="paginas"></div>
            </div>
            <div class="col-md-4">
              <label for="genero" class="form-label">Género</label>
              <input id="genero" name="genero" class="form-control" required minlength="2">
              <div class="invalid-feedback" data-error="genero"></div>
            </div>
            <div class="col-md-6">
              <label for="correo" class="form-label">Correo de quien propone</label>
              <input id="correo" name="correo" type="email" class="form-control" required>
              <div class="invalid-feedback" data-error="correo"></div>
            </div>
            <div class="col-md-6">
              <label for="fecha" class="form-label">Fecha de la sesión</label>
              <input id="fecha" name="fecha" type="date" class="form-control" required>
              <div class="invalid-feedback" data-error="fecha"></div>
            </div>
            <div class="col-12">
              <label for="motivo" class="form-label">Motivo de la propuesta</label>
              <textarea id="motivo" name="motivo" class="form-control" required minlength="10" rows="3"></textarea>
              <div class="invalid-feedback" data-error="motivo"></div>
            </div>
            <div class="col-12"><button class="btn btn-primary" type="submit">Enviar propuesta</button></div>
          </form>
          <div id="estado-propuesta" class="alert d-none mt-3" role="status" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <!-- render.js llena este modal y Bootstrap controla su apertura y cierre. -->
    <div class="modal fade" id="detalle-modal" tabindex="-1" aria-labelledby="detalle-titulo" aria-hidden="true">
      <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="detalle-titulo">Detalle del libro</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body" id="detalle-contenido"></div>
      </div></div>
    </div>

    <!-- Bootstrap se carga como archivo local; main.js sí usa módulos import/export. -->
    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
